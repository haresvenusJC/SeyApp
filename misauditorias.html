<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Auditorías - Sey</title>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            background: linear-gradient(135deg, #e6007e, #6b21a8);
            background-attachment: fixed;
            color: #333; 
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 1200px; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
            height: fit-content;
        }

        h2 { color: #6b21a8; margin-top: 0; }
        button { background: #6b21a8; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #551a8b; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .filter-section {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #e2e8f0;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-group label {
            font-weight: bold;
            font-size: 0.85rem;
            color: #4b5563;
        }

        input[type="date"] {
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #fff;
            color: #6b21a8;
            border-bottom: 2px solid #6b21a8;
            padding: 12px 10px;
            font-weight: bold;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .badge-cadena {
            background: #e9d5ff;
            color: #6b21a8;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            text-transform: uppercase;
        }

        .btn-evidencia {
            background: #db2777;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            margin-bottom: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-evidencia:hover { background: #be185d; }

        .btn-accion {
            background: #16a34a;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn-accion:hover { background: #15803d; }

        .tabla-inventario-mini {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-collapse: collapse;
            background: #fff;
            max-height: 120px;
            display: block;
            overflow-y: auto;
        }

        .tabla-inventario-mini th, .tabla-inventario-mini td {
            padding: 6px 8px;
            font-size: 0.8rem;
            border-bottom: 1px solid #edf2f7;
        }

        .tabla-inventario-mini th {
            background: #f1f5f9;
            color: #475569;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .error { color: red; font-weight: bold; }
        .info { color: #6b21a8; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <div>
                <h2>📋 Detalle de Inventarios y Evidencias por Sucursal</h2>
            </div>
            <button onclick="window.location.href='index.html'" style="background: #6c757d; width: auto; padding: 6px 12px; font-size: 0.9rem;">⬅ Volver a App</button>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label>Desde:</label>
                <input type="date" id="filtro-desde" onchange="cargarAuditorias()">
            </div>
            <div class="filter-group">
                <label>Hasta:</label>
                <input type="date" id="filtro-hasta" onchange="cargarAuditorias()">
            </div>
            <button onclick="filtroHoy()" style="padding: 7px 12px; font-size: 0.85rem; margin-top: 0;">Hoy</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Fecha / Hora</th>
                        <th>Auditor</th>
                        <th>Cadena</th>
                        <th>Sucursal</th>
                        <th>Comentarios</th>
                        <th>Evidencias / Acciones</th>
                        <th>Inventario Detallado</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo-auditorias">
                    <tr>
                        <td colspan="7" class="info">Cargando tus auditorías...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE IMÁGENES -->
    <div id="modal-galeria" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; flex-direction:column;">
        <div style="background:white; padding:20px; border-radius:8px; max-width:90%; max-height:80vh; overflow-y:auto; text-align:center; position:relative;">
            <button onclick="cerrarModal()" style="position:absolute; top:10px; right:10px; background:#e11d48; padding:5px 10px; font-size:0.8rem;">✕ Cerrar</button>
            <h3 id="modal-titulo" style="color:#6b21a8; margin-top:0;">Evidencias</h3>
            <div id="modal-contenido-fotos" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:15px;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://snjvdfjouoxnaopgeral.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuanZkZmpvdW94bmFvcGdlcmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxOTI2MzEsImV4cCI6MjEwMDc2ODYzMX0.CIrxhWZtySmv42iZfFGHgyavP6uxA44kbbBQlQNc8uc';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const usuarioActual = localStorage.getItem("sey_user") || "";

        window.auditoriasCache = [];
        window.productosCache = {};

        document.addEventListener("DOMContentLoaded", async () => {
            if (!usuarioActual) {
                alert("No hay sesión activa. Redirigiendo al login.");
                window.location.href = 'index.html';
                return;
            }

            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById("filtro-desde").value = hoy;
            document.getElementById("filtro-hasta").value = hoy;

            await precargarNombresProductos();
            cargarAuditorias();
        });

        async function precargarNombresProductos() {
            try {
                const { data, error } = await supabaseClient.from('productos').select('id, nombre_producto');
                if (!error && data) {
                    data.forEach(p => {
                        window.productosCache[p.id] = p.nombre_producto;
                    });
                }
            } catch (err) {
                console.error("Error al cargar diccionario de productos:", err);
            }
        }

        function filtroHoy() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById("filtro-desde").value = hoy;
            document.getElementById("filtro-hasta").value = hoy;
            cargarAuditorias();
        }

        async function cargarAuditorias() {
            const tbody = document.getElementById("tabla-cuerpo-auditorias");
            const fechaDesde = document.getElementById("filtro-desde").value;
            const fechaHasta = document.getElementById("filtro-hasta").value;

            tbody.innerHTML = `<tr><td colspan="7" class="info">Buscando registros del día...</td></tr>`;

            try {
                let { data, error } = await supabaseClient
                    .from('visitas_auditoria')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const { data: sucursalesData } = await supabaseClient.from('sucursales').select('*');
                const sucursalesMap = {};
                if (sucursalesData) {
                    sucursalesData.forEach(s => sucursalesMap[s.id] = s);
                }

                data.forEach(v => {
                    v.sucursales = sucursalesMap[v.sucursal_id] || null;
                });

                let registrosFiltrados = data || [];

                if (fechaDesde || fechaHasta) {
                    registrosFiltrados = registrosFiltrados.filter(v => {
                        if (!v.created_at) return false;
                        const fechaRegistro = v.created_at.split('T')[0];

                        if (fechaDesde && fechaHasta) {
                            return fechaRegistro >= fechaDesde && fechaRegistro <= fechaHasta;
                        } else if (fechaDesde) {
                            return fechaRegistro >= fechaDesde;
                        } else if (fechaHasta) {
                            return fechaRegistro <= fechaHasta;
                        }
                        return true;
                    });
                }

                window.auditoriasCache = registrosFiltrados;

                if (!window.auditoriasCache || window.auditoriasCache.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: #666; padding: 20px;">No se encontraron auditorías para el rango de fechas seleccionado.</td></tr>`;
                    return;
                }

                let html = '';
                window.auditoriasCache.forEach((visita, index) => {
                    const fechaObj = new Date(visita.created_at);
                    const fechaFormateada = `${fechaObj.getDate()}/${fechaObj.getMonth()+1}/${fechaObj.getFullYear()}, ${fechaObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
                    
                    const auditor = visita.usuario || 'N/D';
                    const cadenaNombre = visita.sucursales?.cadena || (visita.sucursales?.nombre_sucursal ? visita.sucursales.nombre_sucursal.split(' - ')[0] : 'GENERAL');
                    const nombreSucursal = visita.sucursales ? visita.sucursales.nombre_sucursal : 'Sucursal ID: ' + visita.sucursal_id;
                    const comentarios = visita.comentarios || 'Sin comentarios';

                    const totalAnaquel = visita.fotos_anaquel ? visita.fotos_anaquel.length : 0;
                    const totalAcciones = visita.fotos_acciones ? visita.fotos_acciones.length : 0;

                    let inventarioHtml = `
                        <table class="tabla-inventario-mini">
                            <thead>
                                <tr>
                                    <th>PRODUCTO</th>
                                    <th style="text-align: right;">CANT.</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    if (visita.inventario && Array.isArray(visita.inventario) && visita.inventario.length > 0) {
                        visita.inventario.forEach(item => {
                            const nombreProd = window.productosCache[item.producto_id] || 'Producto ID: ' + item.producto_id;
                            inventarioHtml += `
                                <tr>
                                    <td>${nombreProd}</td>
                                    <td style="text-align: right; font-weight: bold; background: #fdf4f8; color: #db2777; width: 50px;">${item.cantidad}</td>
                                </tr>
                            `;
                        });
                    } else {
                        inventarioHtml += `<tr><td colspan="2" style="text-align:center; color:#888;">Sin inventario capturado</td></tr>`;
                    }
                    inventarioHtml += `</tbody></table>`;

                    html += `
                        <tr>
                            <td>${fechaFormateada}</td>
                            <td style="font-weight: bold;">${auditor}</td>
                            <td><span class="badge-cadena">${cadenaNombre}</span></td>
                            <td style="font-weight: 500;">${nombreSucursal}</td>
                            <td style="max-width: 200px; word-break: break-word;">${comentarios}</td>
                            <td>
                                <div>
                                    <button class="btn-evidencia" onclick="abrirGaleria(${index}, 'anaquel')">
                                        📷 Evidencias (${totalAnaquel})
                                    </button>
                                </div>
                                <div>
                                    <button class="btn-accion" onclick="abrirGaleria(${index}, 'acciones')">
                                        ✔ Acciones (${totalAcciones})
                                    </button>
                                </div>
                            </td>
                            <td style="min-width: 220px;">
                                ${inventarioHtml}
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

            } catch (err) {
                console.error("Error detallado en carga:", err);
                tbody.innerHTML = `<tr><td colspan="7" class="error">Error al cargar las auditorías: ${err.message}</td></tr>`;
            }
        }

        function abrirGaleria(indexVisita, tipo) {
            const visita = window.auditoriasCache[indexVisita];
            const modal = document.getElementById('modal-galeria');
            const titulo = document.getElementById('modal-titulo');
            const contenedorFotos = document.getElementById('modal-contenido-fotos');

            const fotos = tipo === 'anaquel' ? visita.fotos_anaquel : visita.fotos_acciones;
            titulo.textContent = tipo === 'anaquel' ? 'Evidencias de Anaquel' : 'Acciones Implementadas';
            
            contenedorFotos.innerHTML = '';

            if (!fotos || fotos.length === 0) {
                contenedorFotos.innerHTML = `<p style="color:#666;">No hay fotografías registradas en esta sección.</p>`;
            } else {
                fotos.forEach(url => {
                    contenedorFotos.innerHTML += `
                        <a href="${url}" target="_blank">
                            <img src="${url}" style="width: 120px; height: 120px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc;">
                        </a>
                    `;
                });
            }

            modal.style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-galeria').style.display = 'none';
        }
    </script>
</body>
</html>
